<!DOCTYPE html>
<html lang="en">

<head>
    <title>Moon charts</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="//writ.cmcenroe.me/1.0.4/writ.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/charts.css/dist/charts.min.css">
    <style>
        .arrow {
            font-size: 10px;
            padding: 0px 0px 0px 10px;
            margin: 0px;
            display: inline-block;
            transform-origin: 80% 50%;
        }

        .sunlightPie {
            display: inline-block;
            height: 14px;
            width: 14px;
            /* max-width: 15px; */
            /* width: 25px; */
        }

        .sunlightBar {
            width: 100px;
            margin: 0 auto;
        }

        .sunlightBar .bar {
            --color: orange;
        }

        #charts {
            padding: 5px;
            height: 500px;
            overflow: auto;
        }
    </style>
</head>


<body>

    <script src="locator.js"></script>
    <script src="sunplots.js"></script>
    <script src="vendor/suncalc.js"></script>
    <header>
        <h1>Moon Charts</h1>
        <p>
        </p>
    </header>
    <main>
        <p id="locLabel"></p>
        <button onclick="locator.getLocation(update);">Update my location</button>
        <button onclick="charts.style.display = charts.style.display ? '' : 'none'">Toggle Table</button>
        <pre id="debug"></pre>
        <p>
            <p id="charts" />
        <p id="viz"></p>
        </p>
    </main>

    <script>
        const locator = new Locator();

        const ONE_SEC = 1000;
        const ONE_MIN = ONE_SEC * 60;
        const ONE_HOUR = ONE_MIN * 60;
        const ONE_DAY = ONE_HOUR * 24;

        if (!locator.timestamp) {
            locator.getLocation(onLocation);
        } else {
            onLocation();

            if ((Date.now() - locator.timestamp) > ONE_HOUR) {
                locator.getLocation(onLocation);
            }
        }

        function onLocation() {
            locLabel.innerHTML = `Location: ${locator.latitude.toFixed(3)}, ${locator.longitude.toFixed(3)}
    <br/>Updated: ${new Date(locator.timestamp)}`;


            let days = calcMonth(locator.latitude, locator.longitude);

            console.log(days);

            days.forEach(day => {
                const rise = day.rise ? getLocal(day.rise) : '-';
                const set = day.set ? getLocal(day.set) : '-';

                const phase = day.illumination.phase;
                const fraction = day.illumination.fraction;

                debug.innerHTML += `Rise: ${rise}\tSet: ${set}\tPhase: ${phase.toFixed(3)}\tFraction: ${fraction.toFixed(3)}\n`;
            })

        }

        /* Time helpers */

        function pad(str) {
            const fmt = `00${str}`
            return fmt.slice(fmt.length - 2)
        }

        function getLocal(date) {
            return `${getLocalDate(date)} ${getLocalTime(date)}`
        }

        function getLocalTime(date) {
            return `${pad(date.getHours())}:${pad(date.getMinutes())}`
            //  + `:${pad(date.getSeconds())}`
        }

        function getLocalDate(date) {
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`
        }


        function calcMonth(lat, lon) {

            // get moon timings

            var now = new Date();
            var moonTimesToday = SunCalc.getMoonTimes(now, lat, lon);
            console.log('moonTimesToday', moonTimesToday);

            var moonTimesTmr = SunCalc.getMoonTimes(new Date(now.getTime() + ONE_DAY), lat, lon);
            console.log('moonTimesTmr', moonTimesTmr);

            const DAYS_BEFORE = 3;
            const DAYS_AFTER = 30;

            let days = [];
            for (let day = -DAYS_BEFORE; day < DAYS_AFTER; day++) {
                const dt = new Date(now.getTime() + day * ONE_DAY);

                // set and rise times
                const times = SunCalc.getMoonTimes(dt, lat, lon);
                const illumination = SunCalc.getMoonIllumination(dt, lat, lon);

                // suncalc3 supports moon data which gets
                // next moon phases

                let risePos;
                if (times.rise) {
                    risePos = SunCalc.getMoonPosition(times.rise, lat, lon)
                }

                let setPos;
                if (times.set) {
                    setPos = SunCalc.getMoonPosition(times.set, lat, lon)
                }

                // TODO: add tinyAzimuthHelper

                const info = Object.assign({
                    time: dt,
                    risePos, setPos, illumination,
                }, times);

                days.push(info);
            }

            return days;
        }


    </script>
</body>

</html>
