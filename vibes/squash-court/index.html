<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squash Court — camera from the court lines</title>
<style>
  :root { color-scheme: dark; --bg: #0f1115; --panel: #181b21; --fg: #e8e8ea; --dim: #9aa0a8; --acc: #00e5ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 6px var(--side, 620px); grid-template-rows: auto 1fr auto; height: 100dvh; }
  header { grid-column: 1 / 4; display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 600; }
  button, label.chk { background: #262a33; color: var(--fg); border: 1px solid #333844; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  #wrap { position: relative; min-height: 0; }
  #stage { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  aside { background: var(--panel); padding: 10px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 12px; align-content: start; }
  aside .wide { grid-column: 1 / -1; }
  aside figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  #grip { cursor: col-resize; background: #222630; touch-action: none; }
  #grip:hover, #grip.drag { background: var(--acc); }
  .heat2 { aspect-ratio: 6.4 / 9.75; }
  #feed { font: 13px system-ui; margin: 0; padding: 0; list-style: none; max-height: 240px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
  #feed li { padding: 4px 6px; border-left: 3px solid #555; background: #1e2128; border-radius: 3px; }
  #feed li.new { animation: flash 1.2s ease-out; }
  #feed li .t { color: var(--dim); font: 11px ui-monospace, monospace; margin-right: 6px; }
  #feed li.maybe { opacity: 0.6; }
  @keyframes flash { from { background: #34404f; } to { background: #1e2128; } }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 4px 0 0; font-weight: 600; }
  canvas.panel { width: 100%; background: #1e1e1e; border-radius: 4px; display: block; image-rendering: auto; }
  #plan { aspect-ratio: 6.4 / 9.75; }
  #wall { aspect-ratio: 6.4 / 5; }
  #view3d { aspect-ratio: 8 / 5; cursor: grab; touch-action: none; }
  #readout { font: 12px ui-monospace, monospace; white-space: pre-wrap; color: #cfd3d8; margin: 0; }
  footer { grid-column: 1 / 4; padding: 6px 10px; background: var(--panel); color: var(--dim); font-size: 12px; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto auto; } #grip { display: none; } aside { grid-row: 3; } footer { grid-column: 1; } header { grid-column: 1; } }
</style>
</head>
<body>
<header>
  <h1>Squash Court</h1>
  <button id="open" title="Photo or video (or drop / paste one anywhere)">Open…</button>
  <input id="file" type="file" accept="image/*,video/*,.json" hidden>
  <button id="camera">Camera</button>
  <button id="demo" title="A synthetic frame with a known camera">Demo frame</button>
  <button id="play" hidden>Pause</button>
  <button id="sound" hidden title="The video's audio">Sound on</button>
  <button id="redetect">Re-detect</button>
  <label class="chk"><input id="lines" type="checkbox" checked> Court overlay</label>
  <label class="chk" title="Players' feet and the ball, in metres"><input id="rally" type="checkbox" checked> Players &amp; ball</label>
  <label class="chk" title="Where each player spent their time, on the floor plan"><input id="heat" type="checkbox" checked> Heatmap</label>
  <label class="chk" title="Where the ball bounced on the floor and hit the front wall"><input id="bounces" type="checkbox" checked> Bounces</label>
  <label class="chk" title="Read the commentary aloud"><input id="speak" type="checkbox"> Speak</label>
  <button id="clear" title="Clear measured points, heatmaps, bounces, speeds and commentary">Clear</button>
  <button id="export">Export JSON</button>
</header>
<div id="wrap"><canvas id="stage" aria-label="Frame with the fitted court drawn over it; click to measure a point on the court"></canvas></div>
<div id="grip" role="separator" aria-orientation="vertical" aria-label="Resize the side panel" tabindex="0"></div>
<aside>
  <figure class="wide"><h2>Commentary</h2><ol id="feed" aria-live="polite"></ol></figure>
  <figure><h2>Floor, rectified (front wall at the top)</h2><canvas id="plan" class="panel" width="256" height="390"></canvas></figure>
  <figure><h2>Front wall: ball contacts (last in green)</h2><canvas id="wall" class="panel" width="256" height="200"></canvas>
    <h2>Player speed</h2><canvas id="speed" class="panel" width="320" height="110"></canvas></figure>
  <figure><h2 id="heat1t">Player 1 heatmap</h2><canvas id="heat1" class="panel heat2" width="256" height="390"></canvas></figure>
  <figure><h2 id="heat2t">Player 2 heatmap</h2><canvas id="heat2" class="panel heat2" width="256" height="390"></canvas></figure>
  <figure class="wide"><h2>3D (drag to orbit, wheel to zoom)</h2><canvas id="view3d" class="panel" width="480" height="300"></canvas></figure>
  <pre id="readout" class="wide"></pre>
</aside>
<footer id="status">Click the frame to place a point on the floor or walls, in metres.</footer>
<script type="module" src="app.js"></script>
</body>
</html>
