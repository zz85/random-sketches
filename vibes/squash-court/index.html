<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squash Court — camera from the court lines</title>
<style>
  :root { color-scheme: dark; --bg: #0f1115; --panel: #181b21; --fg: #e8e8ea; --dim: #9aa0a8; --acc: #00e5ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 6px var(--side, 620px); grid-template-rows: auto 1fr auto; height: 100dvh; }
  header { grid-column: 1 / 4; display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 600; }
  .zoom, .seg { display: inline-flex; gap: 2px; background: #1b1e25; border: 1px solid #333844; border-radius: 16px; padding: 2px; }
  .zoom button, .seg button { border-radius: 14px; padding: 4px 9px; border: 0; min-width: 3.2em; }
  .zoom button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: #ffe600; color: #111; font-weight: 600; }
  button, label.chk { background: #262a33; color: var(--fg); border: 1px solid #333844; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  #wrap { position: relative; min-height: 0; }
  #stage { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  aside { position: relative; /* holds its absolutely placed bits (the screen-reader list), which otherwise made the whole page scroll */ background: var(--panel); padding: 10px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 12px; align-content: start; }
  aside .wide { grid-column: 1 / -1; }
  aside figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  #grip { cursor: col-resize; background: #222630; touch-action: none; }
  #grip:hover, #grip.drag { background: var(--acc); }
  .heat2 { aspect-ratio: 6.4 / 9.75; }
  pre.coach { margin: 0 0 6px; font: 11px/1.45 ui-monospace, monospace; white-space: pre-wrap; color: #ddd; }
  .coachMaps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .respCtl { display: flex; gap: 6px; margin-bottom: 6px; }
  .respTitle { text-align: center; font: 600 13px system-ui; margin: 2px 0; }
  .respQ { text-align: center; font: 12px system-ui; margin: 0 0 6px; }
  .respQ i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: -1px; }
  .respWrap { position: relative; max-width: 300px; margin: 0 auto; }
  .respTip { position: absolute; z-index: 2; background: #fff; color: #222; border-radius: 8px; box-shadow: 0 3px 14px rgba(0,0,0,.45); padding: 8px 12px; font: 12px/1.6 system-ui; min-width: 140px; pointer-events: none; }
  .respTip h4 { margin: 0 0 4px; padding-bottom: 3px; border-bottom: 1px solid #ddd; text-align: center; font-size: 13px; }
  .respTip div { display: flex; justify-content: space-between; gap: 14px; } .respTip b { color: #1877f2; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .coachMaps h3 { font: 600 11px system-ui; margin: 0 0 3px; color: #bbb; }
  #feed { font: 13px system-ui; margin: 0; padding: 0; list-style: none; max-height: 240px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
  #feed li { padding: 4px 6px; border-left: 3px solid #555; background: #1e2128; border-radius: 3px; }
  #feed li.new { animation: flash 1.2s ease-out; }
  #feed li .t { color: var(--dim); font: 11px ui-monospace, monospace; margin-right: 6px; }
  #feed li.maybe { opacity: 0.6; }
  #scrub { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: linear-gradient(transparent, rgba(0,0,0,.75)); }
  #scrub[hidden] { display: none; }
  #seek { flex: 1; accent-color: var(--acc); }
  #tlabel { font: 12px ui-monospace, monospace; color: #ddd; min-width: 11ch; text-align: right; }
  #cc { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); max-width: 80%; padding: 6px 12px; background: rgba(0,0,0,.78); color: #fff; font: 600 18px/1.35 system-ui; border-radius: 4px; text-align: center; pointer-events: none; transition: opacity .3s; }
  #cc.off { opacity: 0; }
  .names { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .names label { display: flex; gap: 6px; align-items: center; }
  .names input { width: 13ch; background: #262a33; color: var(--fg); border: 1px solid #333844; border-radius: 4px; padding: 4px 6px; font: inherit; }
  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: #aab; }
  .legend li { display: flex; align-items: center; gap: 4px; }
  .legend .ln { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
  .legend .ln.dash { border-top-style: dashed; }
  .chk3 { font-weight: normal; font-size: 12px; margin-left: 8px; cursor: pointer; }
  .sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  #nameNote { color: var(--dim); font-size: 12px; }
  @keyframes flash { from { background: #34404f; } to { background: #1e2128; } }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 4px 0 0; font-weight: 600; }
  canvas.panel { width: 100%; background: #1e1e1e; border-radius: 4px; display: block; image-rendering: auto; }
  #plan { aspect-ratio: 6.4 / 9.75; }
  #wall { aspect-ratio: 6.4 / 5; }
  #view3d { aspect-ratio: 8 / 5; cursor: grab; touch-action: none; }
  #readout { font: 12px ui-monospace, monospace; white-space: pre-wrap; color: #cfd3d8; margin: 0; }
  footer { grid-column: 1 / 4; padding: 6px 10px; background: var(--panel); color: var(--dim); font-size: 12px; }
  /* Live: the stage alone, with the HUD; Analyse: the panels beside it (below it on a phone) */
  body.live { grid-template-columns: 1fr; }
  body.live aside, body.live #grip { display: none; }
  body.live header, body.live footer { grid-column: 1; }
  #hud { position: absolute; left: 8px; top: 8px; max-width: calc(100% - 16px); text-align: left; background: rgba(0,0,0,.62); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; font: 600 13px/1.45 system-ui; cursor: pointer; }
  #hud[hidden] { display: none; }
  #hud span { display: block; } #hud #hudB { font-weight: 500; color: #ddd; }
  #hudRec { display: inline-block !important; width: 9px; height: 9px; border-radius: 50%; background: #ff3b30; margin-right: 6px; animation: blink 1.2s steps(2) infinite; }
  #hudRec[hidden] { display: none !important; }
  @keyframes blink { 50% { opacity: .25; } }
  .recCtl { display: flex; gap: 8px; align-items: center; }
  .note { color: var(--dim); font-size: 12px; }
  .recList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow: auto; }
  .recList li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 4px 6px; background: #1e2128; border-radius: 3px; font-size: 13px; }
  .recList li span { flex: 1; min-width: 12em; }
  .recList button { padding: 3px 8px; font-size: 12px; }
  .rallyList li { padding: 0; background: none; } .rallyList button { width: 100%; text-align: left; padding: 5px 8px; font-size: 13px; }
  .rallyList button[aria-current="true"] { border-color: #ffe600; background: #3a3620; }
  .replay { display: flex; gap: 8px; align-items: center; }
  .replay[hidden] { display: none; }
  .replay input { flex: 1; accent-color: var(--acc); }
  #replayT { font: 12px ui-monospace, monospace; color: #ddd; min-width: 12ch; text-align: right; }
  #optsBtn { display: none; }
  @media (max-width: 800px), (max-height: 500px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 32vh 1fr auto; } body.live { grid-template-rows: auto 1fr auto; }
    #grip { display: none; } aside { grid-row: 3; min-height: 0; } footer { grid-column: 1; } header { grid-column: 1; }
    header h1 { display: none; }
    body.live { grid-template-rows: auto 1fr; } body.live footer { display: none; }
    body.nosrc #wrap { display: none; } body.nosrc:not(.live) { grid-template-rows: auto 0 1fr auto; }
    #cc { font-size: 13px; bottom: 10px; max-width: 94%; } body:not(.live) #cc { display: none; } /* the feed is just below */
    /* the less used controls fold away behind Options */
    #optsBtn { display: inline-block; } header .opt { display: none; } header.opts-open .opt { display: revert; }
  }
  /* a phone on its side: the picture and the panels side by side */
  @media (max-height: 500px) and (min-width: 600px) {
    body:not(.live):not(.nosrc) { grid-template-columns: 45% 1fr; grid-template-rows: auto 1fr auto; }
    body:not(.live):not(.nosrc) aside { grid-row: 2; grid-column: 2; }
    body:not(.live):not(.nosrc) header, body:not(.live):not(.nosrc) footer { grid-column: 1 / -1; }
    body:not(.live):not(.nosrc) #cc { display: block; }
  }
</style>
</head>
<body>
<header>
  <h1>Squash Court</h1>
  <button id="open" title="Photo or video (or drop / paste one anywhere)">Open…</button>
  <input id="file" type="file" accept="image/*,video/*,.json" hidden>
  <button id="camera">Camera</button>
  <span id="zoomBar" class="zoom" role="group" aria-label="Camera zoom" hidden></span>
  <span id="modeBar" class="seg" role="group" aria-label="View">
    <button data-mode="live" aria-pressed="false" title="The camera full screen, with a small summary of what is being recorded">Live</button>
    <button data-mode="analyse" aria-pressed="true" title="Heatmaps, bounces, coaching, recordings and the 3D replay">Analyse</button></span>
  <button id="optsBtn" aria-expanded="false" title="More controls">Options</button>
  <button id="demo" class="opt" title="A synthetic frame with a known camera">Demo frame</button>
  <button id="play" hidden>Pause</button>
  <button id="sound" hidden title="The video's audio">Sound on</button>
  <button class="opt" id="redetect">Re-detect</button>
  <label class="chk opt"><input id="lines" type="checkbox" checked> Court overlay</label>
  <label class="chk opt" title="Players' feet and the ball, in metres"><input id="rally" type="checkbox" checked> Players &amp; ball</label>
  <label class="chk opt" title="Where each player spent their time, on the floor plan"><input id="heat" type="checkbox" checked> Heatmap</label>
  <label class="chk opt" title="Where the ball goes next: its latest flight carried on with the same physics, dashed, fading once the ball has passed it"><input id="predict" type="checkbox" checked> Predicted path</label>
  <label class="chk opt" title="Where the ball bounced on the floor and hit the front wall"><input id="bounces" type="checkbox" checked> Bounces</label>
  <label class="chk opt" title="Show the commentary as captions over the video"><input id="cap" type="checkbox" checked> Captions</label>
  <label class="chk opt" title="Read the commentary aloud"><input id="speak" type="checkbox"> Speak</label>
  <button class="opt" id="clear" title="Clear measured points, heatmaps, bounces, speeds and commentary">Clear</button>
  <button class="opt" id="export">Export JSON</button>
</header>
<div id="wrap"><canvas id="stage" aria-label="Frame with the fitted court drawn over it; click to measure a point on the court"></canvas>
  <div id="cc" class="off" aria-hidden="true"></div>
  <button id="hud" hidden title="Open the analysis"><span><i id="hudRec" hidden></i><span id="hudA" style="display:inline"></span></span><span id="hudB"></span></button>
  <div id="scrub" hidden><input id="seek" type="range" min="0" max="1" step="0.04" value="0" aria-label="Video position"><span id="tlabel">0:00 / 0:00</span></div>
</div>
<div id="grip" role="separator" aria-orientation="vertical" aria-label="Resize the side panel" tabindex="0"></div>
<aside>
  <figure class="wide"><h2>Players</h2><div class="names">
    <label><span class="sw" style="background:#ff2d7a"></span><input id="name1" placeholder="Player 1" aria-label="Player 1 name"></label>
    <button id="swapNames" title="Swap the two names">⇄</button>
    <label><span class="sw" style="background:#2dd4ff"></span><input id="name2" placeholder="Player 2" aria-label="Player 2 name"></label>
    <span id="nameNote"></span></div></figure>
  <figure class="wide"><h2>Recordings</h2>
    <div class="recCtl"><label class="chk3" title="Also keep the camera's picture (about 11 MB a minute, in this browser), to watch a session back with the analysis drawn over it"><input id="recVideo" type="checkbox"> record video with camera sessions</label><span id="recVideoNote" class="note"></span></div>
    <div class="recCtl"><button id="recSave" title="Keep everything analysed so far: player positions, ball flights, bounces, shots (a camera session saves itself)">Save this session</button><span id="recNote" class="note" aria-live="polite"></span></div>
    <p id="recEmpty" class="note">None yet. A camera session is recorded as it goes; open one here to see its heatmaps, bounces and a 3D replay.</p>
    <ol id="recList" class="recList"></ol></figure>
  <figure id="ralliesFig" class="wide" hidden><h2>Rallies</h2><ol id="rallyList" class="recList rallyList"></ol></figure>
  <figure class="wide"><h2>Commentary</h2><ol id="feed" aria-live="polite"></ol></figure>
  <figure><h2>Floor, rectified (front wall at the top)</h2><canvas id="plan" class="panel" width="256" height="390"></canvas></figure>
  <figure><h2>Front wall: ball contacts (last in green)</h2><canvas id="wall" class="panel" width="256" height="200"></canvas>
    <h2>Player speed</h2><canvas id="speed" class="panel" width="320" height="110"></canvas></figure>
  <figure class="wide"><h2>Coaching <label class="chk3">show <select id="coachWho" aria-label="Whose numbers the coaching maps show"><option value="0">both</option><option value="1">player 1</option><option value="2">player 2</option></select></label></h2>
    <pre id="coachText" class="coach"></pre>
    <div class="coachMaps">
      <div><h3 title="Where each player stood at the moment the opponent struck the ball; the ring is 1 m round the T">On the T when the opponent hits</h3><canvas id="coachT" class="panel heat2" width="200" height="305"></canvas></div>
      <div><h3 title="Where each volley was taken (filled) and where the opponent was at that moment (ring), joined">Volleys, and the opponent then</h3><canvas id="coachV" class="panel heat2" width="200" height="305"></canvas></div>
      <div><h3 title="The ball's first floor bounce after the front wall, one per shot. ● drive, ▲ drop / kill, ■ lob, ◆ boast; hollow: carried on from the flight, not seen">First bounces</h3><canvas id="coachB" class="panel heat2" width="200" height="305"></canvas></div>
    </div></figure>
  <figure class="wide"><h2>Response patterns</h2>
    <div class="respCtl"><select id="respWho" aria-label="Whose shots"><option value="1">Player 1</option><option value="2">Player 2</option></select>
      <select id="respType" aria-label="Which of their shots"><option value="all">All shots</option><option value="drive">Drives</option><option value="drop">Drops</option><option value="kill">Kills</option><option value="lob">Lobs</option><option value="boast">Boasts</option></select></div>
    <h3 id="respTitle" class="respTitle">Response</h3>
    <p id="respQ" class="respQ"></p>
    <div class="respWrap"><canvas id="resp" class="panel heat2" width="300" height="457" tabindex="0" aria-describedby="respList"></canvas><div id="respTip" class="respTip" hidden></div></div>
    <p id="respList" class="sr"></p></figure>
  <figure><h2 id="heat1t">Player 1 heatmap</h2><canvas id="heat1" class="panel heat2" width="256" height="390"></canvas></figure>
  <figure><h2 id="heat2t">Player 2 heatmap</h2><canvas id="heat2" class="panel heat2" width="256" height="390"></canvas></figure>
  <figure class="wide"><h2>3D (drag to orbit, wheel to zoom) <label class="chk3"><input id="frustum" type="checkbox" checked> camera view</label></h2><canvas id="view3d" class="panel" width="480" height="300"></canvas>
    <div id="replayBar" class="replay" hidden><button id="replayPlay" aria-label="Play the replay">▶</button><input id="replaySeek" type="range" min="0" max="1" step="0.02" value="0" aria-label="Replay time"><span id="replayT">0:00</span></div>
    <ul class="legend" aria-label="3D view colours">
      <li><span class="ln" style="border-color:#ffe600"></span>ball, fitted</li>
      <li><span class="ln dash" style="border-color:#ff8a00"></span>ball, predicted</li>
      <li><span class="ln" style="border-color:rgba(255,230,0,0.35)"></span>its shadow on the floor</li>
      <li><span class="sw" style="background:#fff"></span>ball now</li>
      <li><span class="sw" style="background:#ff8a00"></span>predicted impact</li>
      <li><span class="sw" style="background:#ff3b30"></span>out / tin</li>
      <li><span class="ln" style="border-color:#ff2d7a"></span><span class="ln" style="border-color:#2dd4ff"></span>players</li>
      <li><span class="ln" style="border-color:#ffe600"></span>camera's field of view</li>
      <li><span class="ln" style="border-color:#d33"></span>court lines</li>
      <li><span class="ln" style="border-color:#666"></span>walls and floor</li>
    </ul></figure>
  <pre id="readout" class="wide"></pre>
</aside>
<footer id="status">Click the frame to place a point on the floor or walls, in metres.</footer>
<script type="module" src="app.js"></script>
</body>
</html>
