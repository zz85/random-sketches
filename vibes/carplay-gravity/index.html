<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08090b">
<title>CarPlay Gravity</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #08090b; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  /* a bezel round the screen when there is room, the bare screen on a head-unit-sized display */
  #unit { height: 100%; display: flex; padding: 18px; }
  #bezel { flex: 1; display: flex; padding: 12px; border-radius: 28px; background: linear-gradient(#1d1f23, #0d0e10);
    box-shadow: inset 0 1px 0 #2e3137, inset 0 -1px 0 #000, 0 12px 34px #000c; }
  #screen { position: relative; flex: 1; overflow: hidden; border-radius: 16px; background: #07080c; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #cv.grabbing { cursor: grabbing; }
  @media (max-height: 600px), (max-width: 860px) { #unit, #bezel { padding: 0; border-radius: 0; box-shadow: none; } #screen { border-radius: 0; } }
</style>
</head>
<body>
<div id="unit"><div id="bezel"><div id="screen"><canvas id="cv"></canvas></div></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
