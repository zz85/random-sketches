<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A celestial watch for your phone, and a planetarium you hold up to the sky: the real sky for your time and place.">
<title>Orrery</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="../pwa/install.js"></script>
<script src="astronomy.browser.min.js"></script>
<script src="geomag.js"></script>
<script>
  // the page itself never zooms: pinch and double-tap belong to the watch and the sky
  for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 || e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
  addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
</script>
<style>
  :root { --gold: #e9cf93; --ink: #050914; --glass: rgba(10, 14, 30, 0.55); --line: rgba(233, 207, 147, 0.28); }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--ink); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#gl { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.35s; }
  #fade.on { opacity: 1; }
  #xfade { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--gold); font: italic 15px Georgia, serif; letter-spacing: 0.12em; transition: opacity 1.2s; pointer-events: none; }
  body.ready #status { opacity: 0; }
  .ui { opacity: 0; transition: opacity 1s; }
  body.ready .ui { opacity: 1; }
  body.calm .ui { opacity: 0 !important; pointer-events: none; }
  #hud { position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); color: var(--gold); font: 11.5px/1.45 Georgia, serif;
    letter-spacing: 0.06em; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); pointer-events: none; max-width: 52vw; }
  #hud .sub { opacity: 0.75; font-style: italic; }
  #heading { color: #fff1c9; font-variant-numeric: tabular-nums; }
  #top { position: fixed; right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .pill { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--glass); border-radius: 22px; padding: 3px;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--gold); font: 12px Georgia, serif; }
  .pill button { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; padding: 7px 11px; border-radius: 18px; cursor: pointer; letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 6px; min-width: 34px; justify-content: center; }
  .pill button.on { background: rgba(233, 207, 147, 0.22); color: #fff3d2; }
  .pill button:focus-visible { outline: 1px solid var(--gold); }
  .pill svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .col { flex-direction: column; }
  body.mini .skyonly { display: none !important; }
  body:not(.mini) .minionly { display: none !important; }
  button { touch-action: manipulation; }
  #bar { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100vw - 20px));
    border: 1px solid var(--line); background: var(--glass); border-radius: 18px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--gold); font: 12px Georgia, serif; }
  #row { display: flex; align-items: center; gap: 4px; padding: 6px 8px 2px; }
  #row button { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; border-radius: 14px; cursor: pointer; padding: 6px 8px; display: grid; place-items: center; }
  #row button.on { background: rgba(233, 207, 147, 0.22); color: #fff3d2; }
  #row svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #when { flex: 1; text-align: center; cursor: pointer; line-height: 1.15; padding: 2px 4px; border-radius: 10px; }
  #when b { display: block; font: 400 21px Georgia, serif; letter-spacing: 0.05em; color: #fbedc9; font-variant-numeric: tabular-nums; }
  #when span { font-style: italic; opacity: 0.8; font-size: 11.5px; }
  #when em { font-style: normal; color: #ffd27d; font-size: 11px; letter-spacing: 0.08em; }
  #speed { min-width: 48px; font-variant-numeric: tabular-nums; }
  #units { display: flex; gap: 0; margin-left: 2px; }
  #units button { padding: 5px 7px; font-size: 11px; letter-spacing: 0.1em; }
  #tape { display: block; width: 100%; height: 38px; touch-action: none; cursor: ew-resize; }
  #pick { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; left: 50%; bottom: 0; }
  #card { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 108px); width: min(290px, calc(100vw - 24px));
    border: 1px solid var(--line); background: rgba(8, 11, 26, 0.72); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-radius: 14px;
    color: #f2e3bf; font: 12px/1.5 Georgia, serif; padding: 11px 15px; opacity: 0; transform: translateY(8px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
  #card.show { opacity: 1; transform: none; pointer-events: auto; }
  #card h2 { margin: 0 0 3px; font: 400 16px Georgia, serif; letter-spacing: 0.26em; color: var(--gold); }
  #card .point { color: #fff1c9; margin-bottom: 4px; font-style: italic; }
  #card .k { color: rgba(233, 207, 147, 0.7); font-style: italic; }
  #card table { border-collapse: collapse; width: 100%; } #card td { padding: 0; } #card td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #card button { position: absolute; right: 8px; top: 5px; appearance: none; border: 0; background: none; color: var(--gold); font: 18px Georgia, serif; cursor: pointer; }
  #arrow { position: fixed; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; opacity: 0; transition: opacity 0.3s; color: var(--gold);
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.9)); }
  #arrow.show { opacity: 1; }
  #arrow svg { width: 100%; height: 100%; }
  #arrow span { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font: italic 11px Georgia, serif; white-space: nowrap; letter-spacing: 0.08em; }
  #hint { position: fixed; left: 50%; top: 42%; transform: translateX(-50%); color: #f4ead0; font: italic 13px Georgia, serif;
    text-align: center; width: max-content; max-width: 80vw; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); opacity: 0; transition: opacity 0.8s; pointer-events: none; }
  #hint.show { opacity: 0.95; }
  @media (max-width: 480px) { #hud { font-size: 10.5px; max-width: calc(100vw - 150px); } #card { padding-bottom: 8px; } #card table { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; row-gap: 3px; } #card tbody { display: contents; } #card tr { display: flex; flex-direction: column; } #card td:last-child { text-align: left; } #card .k { font-size: 10px; line-height: 1.2; } #card td { font-size: 12.5px; white-space: nowrap; } #card .point { font-size: 13px; } #when span { white-space: nowrap; font-size: 10.5px; } #units button { padding: 5px 5px; } .pill button { padding: 7px 9px; } #mode button span { display: none; } #when b { font-size: 19px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.187.0/build/three.webgpu.js",
  "three/webgpu": "https://unpkg.com/three@0.187.0/build/three.webgpu.js",
  "three/tsl": "https://unpkg.com/three@0.187.0/build/three.tsl.js",
  "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body class="mini">
<canvas id="gl"></canvas>
<div id="status">setting the movement…</div>
<div id="hud" class="ui">
  <div id="place"></div>
  <div class="sub" id="info"></div>
  <div id="heading"></div>
</div>
<div id="top" class="ui">
  <div class="pill" id="mode" role="group" aria-label="Mode">
    <button type="button" data-mode="mini" title="Miniature: the celestial watch (m)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M9 6.5l.8-4h4.4l.8 4M9 17.5l.8 4h4.4l.8-4M12 9v3l2 1.5"/></svg><span>Miniature</span></button>
    <button type="button" data-mode="sky" title="Immersive: the sky around you (m)"><svg viewBox="0 0 24 24"><path d="M3 18a9 9 0 0 1 18 0z"/><path d="M2 18h20"/><circle cx="9" cy="12" r="0.9"/><circle cx="14.5" cy="10" r="0.9"/><circle cx="16.5" cy="14" r="0.9"/></svg><span>Immersive</span></button>
  </div>
  <div class="pill col">
    <button id="motion" type="button" title="Motion and compass (g)" aria-label="Motion and compass"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2L13 13l-3.8 1.8L11 11z"/></svg></button>
    <button id="labels" type="button" title="Names (l)" aria-label="Names"><svg viewBox="0 0 24 24"><path d="M5 18L10.5 5h1L17 18M7.3 13h7.4"/><circle cx="19.5" cy="5.5" r="1.2"/></svg></button>
    
    <button id="centre" type="button" class="minionly" title="Earth at the centre (c)" aria-label="Earth or Sun at the centre"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6" fill="currentColor"/><circle cx="12" cy="12" r="7.5"/><circle cx="19.5" cy="12" r="1.5"/><path d="M12 2.2v2M12 19.8v2M2.2 12h2"/></svg></button>
    <button id="magnify" type="button" class="skyonly" title="Bring the planets closer (z)" aria-label="Magnify"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5M8 10.5h5M10.5 8v5"/></svg></button>
    <button id="locate" type="button" title="Use my location" aria-label="Locate"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.2"/></svg></button>
  </div>
</div>
<div id="hint" class="ui"></div>
<div id="arrow"><svg viewBox="0 0 46 46"><path d="M23 6l12 20h-8v14h-8V26h-8z" fill="currentColor" opacity="0.9"/></svg><span></span></div>
<div id="card"><button type="button" aria-label="Close">×</button><div id="cardBody"></div></div>
<div id="bar" class="ui">
  <div id="row">
    <button id="now" type="button" title="Now (n)">NOW</button>
    <button id="slower" type="button" title="Slower / backwards ([)" aria-label="Slower"><svg viewBox="0 0 24 24"><path d="M11 7l-5 5 5 5M18 7l-5 5 5 5"/></svg></button>
    <button id="play" type="button" title="Pause / play (space)" aria-label="Pause"></button>
    <button id="faster" type="button" title="Faster (])" aria-label="Faster"><svg viewBox="0 0 24 24"><path d="M6 7l5 5-5 5M13 7l5 5-5 5"/></svg></button>
    <div id="when" title="Pick a date and time"><b id="clock">--:--</b><span id="date"></span> <em id="speed"></em></div>
    <div id="units" role="group" aria-label="Drag scale">
      <button type="button" data-u="h" title="Drag through hours">H</button>
      <button type="button" data-u="d" title="Drag through days">D</button>
      <button type="button" data-u="m" title="Drag through months">M</button>
      <button type="button" data-u="y" title="Drag through years">Y</button>
    </div>
  </div>
  <canvas id="tape" title="Drag to move through time"></canvas>
  <input id="pick" type="datetime-local" step="60">
</div>
<script type="module" src="main.js"></script>
</body>
</html>
