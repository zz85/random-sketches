<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorairo · 空色</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1530; }
  canvas { display: block; touch-action: none; }
  #title { position: fixed; left: 22px; bottom: 18px; color: #fff; font: 300 15px/1.3 "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    letter-spacing: 0.2em; text-shadow: 0 1px 8px rgba(0, 20, 60, 0.45); opacity: 0.85; pointer-events: none; transition: opacity 0.6s; }
  #title small { display: block; font-size: 11px; letter-spacing: 0.08em; opacity: 0.75; margin-top: 4px; }
  #title.gone, #sound.gone, #clock.gone { opacity: 0; pointer-events: none; }
  #clock { position: fixed; left: 22px; top: 16px; color: #fff; font: 300 14px/1.3 "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif; letter-spacing: 0.12em;
    text-shadow: 0 1px 8px rgba(0, 20, 60, 0.5); opacity: 0.85; pointer-events: none; transition: opacity 0.6s; font-variant-numeric: tabular-nums; }
  #sound { position: fixed; right: 18px; bottom: 16px; padding: 6px 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.35); background: rgba(18, 28, 56, 0.45);
    color: #fff; font: 12px Georgia, serif; letter-spacing: 0.08em; cursor: pointer; backdrop-filter: blur(6px); opacity: 0.8; transition: opacity 0.6s; }
  #sound:hover, #sound:focus-visible { opacity: 1; outline: 2px solid rgba(255,255,255,0.6); }
  #sound.on { background: rgba(255, 190, 120, 0.3); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #cfe3ff; font: 14px Georgia, serif; letter-spacing: 0.2em; }
  .lil-gui { --background-color: rgba(18, 28, 56, 0.72); --title-background-color: rgba(30, 48, 96, 0.8); --widget-color: rgba(255,255,255,0.12); --focus-color: rgba(255,255,255,0.2); --number-color: #ffd9a8; --string-color: #bfe0ff; backdrop-filter: blur(6px); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">空色</div>
<div id="title">空色 sorairo<small>drag to look around · H hides the panel · P saves a picture · M sound · Animate folder for time-lapses</small></div>
<div id="clock" hidden aria-live="off"></div>
<button id="sound" type="button" aria-label="Toggle sound">♪ sound off</button>
<script type="module">
  import './main.js';
  document.getElementById('loading').remove();
</script>
</body>
</html>
