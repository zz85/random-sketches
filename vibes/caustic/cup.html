<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120c08">
<meta name="description" content="The bright curve in a coffee cup: rays reflected off a curved mirror pile up on a caustic. Move the sun, change the cup.">
<title>Caustic - the cup</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.svg">
<style>
  body { background: #120c08; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #info { position: fixed; right: max(18px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); max-width: 300px; text-align: right; font-style: italic; opacity: 0.85; text-shadow: 0 1px 6px #000; pointer-events: none; }
  #info b { font-style: normal; letter-spacing: 0.08em; display: block; margin-bottom: 4px; }
  .pill label { display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px; }
  .pill input[type=range] { width: 80px; accent-color: #f1c27a; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="title">CAUSTIC<small>the cup: light reflected off a curve piles up on a caustic</small></div>
<div id="info"><b id="iname"></b><span id="itext"></span></div>
<div id="bar">
  <div class="pill"><button data-shape="cup">Cup</button><button data-shape="ellipse">Ellipse</button><button data-shape="parabola">Bowl</button><button data-shape="heart">Heart</button><button data-shape="flower">Flower</button><button data-shape="draw" title="Draw your own mirror">Draw</button></div>
  <div class="pill"><button data-light="sun">Sun</button><button data-light="lamp">Lamp</button><button id="move" title="Let the light move">Moves</button><button id="env" title="Draw the caustic curve, the envelope of the reflected rays">Envelope</button></div>
  <div class="pill"><label>Bounces <input id="bounces" type="range" min="1" max="6" value="2"></label><label>Rays <input id="rays" type="range" min="6" max="15" value="13"></label><a href="./">Lens</a></div>
</div>
<script type="module" src="cup.js"></script>
</body>
</html>
