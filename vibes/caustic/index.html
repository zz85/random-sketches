<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Rooms lit by moving reflections of water, after the Wallace sets in Blade Runner 2049: the caustics corridor, the office, the hall of water.">
<title>Caustic</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="../pwa/install.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.187.0/build/three.webgpu.js",
  "three/webgpu": "https://unpkg.com/three@0.187.0/build/three.webgpu.js",
  "three/tsl": "https://unpkg.com/three@0.187.0/build/three.tsl.js",
  "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="bar top"></div><div class="bar bottom"></div>
<div id="status">filling the troughs&hellip;</div>
<div id="title">CAUSTIC<small>light off water, after the Wallace sets</small></div>
<div id="caption"></div>
<div id="tune">
  <label>Warmth <input type="range" data-k="warmth" min="0" max="1.6" step="0.01" value="1"><output>1.00</output></label>
  <label>Colour <input type="range" data-k="colour" min="0" max="2" step="0.01" value="1"><output>1.00</output></label>
  <label>Exposure <input type="range" data-k="exposure" min="0.3" max="2.5" step="0.01" value="1"><output>1.00</output></label>
  <label>Haze <input type="range" data-k="haze" min="0" max="6" step="0.01" value="1"><output>1.00</output></label>
  <label>Ripple size <input type="range" data-k="size" min="0.3" max="3" step="0.01" value="1"><output>1.00</output></label>
  <label>Sharpness <input type="range" data-k="sharp" min="0" max="2.5" step="0.01" value="1"><output>1.00</output></label>
  <label>Wave height <input type="range" data-k="height" min="0" max="2.5" step="0.01" value="1"><output>1.00</output></label>
  <label>Water speed <input type="range" data-k="speed" min="0" max="4" step="0.01" value="1"><output>1.00</output></label>
  <label title="Classic only: 0 lays the tile square across each beam, 1 on a level plane of water, so it stretches along the throw">Slant <input type="range" data-k="slant" min="0" max="1" step="0.01" value="1"><output>1.00</output></label>
  <label title="Classic only: more stretch along the throw">Stretch <input type="range" data-k="stretch" min="0.3" max="3" step="0.01" value="1"><output>1.00</output></label>
  <button id="reset">Reset</button>
</div>
<div id="ui">
  <div class="pill"><button data-set="corridor" title="The corridor (1)">Corridor</button><button data-set="office" title="Wallace's office (2)">Office</button><button data-set="hall" title="The hall of water (3)">Hall</button></div>
  <div class="pill"><button id="tour" title="Slow camera moves; drag to look around yourself (space: next shot)">Tour</button><button id="haze" title="Haze in the beams">Haze</button><button id="gi" title="Screen-space global illumination">GI</button><button id="bars" class="on" title="2.39:1">Scope</button><button id="classic" title="Classic: the first version, a tiled caustic projected through each lamp, in place of each lamp's own water traced into the set (c)">Classic</button><button id="splash" title="Disturb the water (s); or tap a lit wall">Splash</button><button id="tunebtn" title="Tune the look and the water (t)">Tune</button><button id="sound" title="The drone and the water">Sound</button><button id="music" title="Music (m)">Music</button>
  <button data-pwa-install title="Install app" style="display:none">Install</button></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
