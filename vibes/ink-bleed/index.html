<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Bleed</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    color: #ccc;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 12px;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    padding: 14px 16px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.08);
    min-width: 240px;
  }

  #controls label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  #controls label span {
    flex-shrink: 0;
    opacity: 0.6;
  }

  #controls label span.val {
    width: 32px;
    text-align: right;
    opacity: 0.4;
    font-size: 10px;
  }

  #controls input[type="range"] {
    flex: 1;
    accent-color: #888;
    height: 2px;
  }

  #controls input[type="text"] {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    color: #ddd;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    width: 100%;
  }

  #controls input[type="text"]:focus {
    border-color: rgba(255,255,255,0.25);
  }

  #controls select {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    color: #ddd;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 11px;
    outline: none;
    flex: 1;
  }

  canvas#gl {
    width: 100vw;
    height: 100vh;
    display: block;
  }

  /* Hide the offscreen source canvas */
  canvas#source { display: none; }
</style>
</head>
<body>

<canvas id="source"></canvas>
<canvas id="gl"></canvas>

<div id="controls">
  <input type="text" id="textInput" value="INK BLEED" placeholder="Type text here..." spellcheck="false" />
  <label>
    <span>font</span>
    <select id="fontSelect">
      <option value="serif">Serif</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Times New Roman', serif">Times New Roman</option>
      <option value="sans-serif">Sans-serif</option>
      <option value="monospace">Monospace</option>
    </select>
  </label>
  <label>
    <span>size</span>
    <input type="range" id="fontSize" min="40" max="400" value="180" step="1" />
    <span class="val" id="fontSizeVal">180</span>
  </label>
  <label>
    <span>bleed</span>
    <input type="range" id="bleedAmount" min="0" max="100" value="40" step="1" />
    <span class="val" id="bleedAmountVal">40</span>
  </label>
  <label>
    <span>roughness</span>
    <input type="range" id="roughness" min="0" max="100" value="55" step="1" />
    <span class="val" id="roughnessVal">55</span>
  </label>
  <label>
    <span>ink density</span>
    <input type="range" id="inkDensity" min="0" max="100" value="65" step="1" />
    <span class="val" id="inkDensityVal">65</span>
  </label>
  <label>
    <span>paper grain</span>
    <input type="range" id="paperGrain" min="0" max="100" value="40" step="1" />
    <span class="val" id="paperGrainVal">40</span>
  </label>
  <label>
    <span>edge pool</span>
    <input type="range" id="edgePool" min="0" max="100" value="50" step="1" />
    <span class="val" id="edgePoolVal">50</span>
  </label>
</div>

<script>
// ============================================================
// GLSL Shaders
// ============================================================

// --- Fullscreen quad vertex shader (shared by all passes) ---
const VERT_QUAD = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

// --- Separable Gaussian Blur ---
const FRAG_BLUR = `#version 300 es
precision highp float;

uniform sampler2D uTex;
uniform vec2 uDir;          // (1/w, 0) or (0, 1/h)
uniform float uRadius;      // blur radius in pixels

in vec2 vUv;
out vec4 fragColor;

void main() {
  float sigma = max(uRadius * 0.33, 0.5);
  float total = 0.0;
  vec4 acc = vec4(0.0);

  int r = int(ceil(uRadius));
  for (int i = -r; i <= r; i++) {
    float fi = float(i);
    float w = exp(-0.5 * (fi * fi) / (sigma * sigma));
    vec2 offset = uDir * fi;
    acc += texture(uTex, vUv + offset) * w;
    total += w;
  }

  fragColor = acc / total;
}`;

// --- Main ink bleed composite shader ---
const FRAG_INK = `#version 300 es
precision highp float;

uniform sampler2D uOriginal;   // crisp text (R channel = ink mask, 0=ink 1=paper)
uniform sampler2D uBlurred;    // blurred text
uniform vec2 uResolution;
uniform float uFontSize;       // font size in pixels (for scale-independent noise)

uniform float uBleed;          // 0..1 bleed spread
uniform float uRoughness;      // 0..1 edge noise amount
uniform float uInkDensity;     // 0..1 overall ink darkness
uniform float uPaperGrain;     // 0..1 paper texture strength
uniform float uEdgePool;       // 0..1 letterpress edge darkening

in vec2 vUv;
out vec4 fragColor;

// ---- Simplex-ish noise (2D) ----
// Hash without sin (better precision on mobile)
vec2 hash22(vec2 p) {
  vec3 a = fract(p.xyx * vec3(213.897, 415.312, 127.453));
  a += dot(a, a.yzx + 19.19);
  return fract(vec2((a.x + a.y) * a.z, (a.x + a.z) * a.y));
}

float hash21(vec2 p) {
  vec3 a = fract(p.xyx * vec3(213.897, 415.312, 127.453));
  a += dot(a, a.yzx + 19.19);
  return fract((a.x + a.y) * a.z);
}

// Value noise
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f); // smoothstep

  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));

  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

// Fractal Brownian Motion
float fbm(vec2 p, int octaves) {
  float val = 0.0;
  float amp = 0.5;
  float freq = 1.0;
  for (int i = 0; i < 8; i++) {
    if (i >= octaves) break;
    val += amp * vnoise(p * freq);
    freq *= 2.17;
    amp *= 0.48;
  }
  return val;
}

// Voronoi-ish cellular noise (for paper fiber feel)
float cellNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  float minDist = 1.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 neighbor = vec2(float(x), float(y));
      vec2 point = hash22(i + neighbor);
      vec2 diff = neighbor + point - f;
      float d = dot(diff, diff);
      minDist = min(minDist, d);
    }
  }
  return sqrt(minDist);
}

void main() {
  vec2 uv = vUv;
  vec2 px = 1.0 / uResolution;

  // ---- Sample textures ----
  float orig = 1.0 - texture(uOriginal, uv).r;  // 1 = ink, 0 = paper
  float blurred = 1.0 - texture(uBlurred, uv).r; // blurred ink mask

  // ---- Scale-independent noise ----
  // All noise is sampled relative to font size, centered on the text.
  // A letter feature at offset d from center maps to d/fontSize,
  // which stays constant regardless of font size changes.
  vec2 baseCoord = (uv - 0.5) * uResolution / uFontSize;

  // Large-scale bleed noise (paper fiber direction / ink flow)
  float bleedNoise = fbm(baseCoord * 3.2, 5);

  // Medium-scale roughness noise
  float roughNoise = fbm(baseCoord * 6.4 + 42.0, 4);

  // Fine paper fiber texture (higher frequency, still font-relative)
  float fiber = cellNoise(baseCoord * 11.0);
  float fineGrain = vnoise(baseCoord * 26.0 + 100.0);

  // ---- Ink bleed / spread ----
  // Use blurred mask, modulate threshold with noise for irregular edges
  float noiseOffset = (bleedNoise - 0.5) * uRoughness * 0.6
                    + (roughNoise - 0.5) * uRoughness * 0.35;

  float threshold = 0.12 + (1.0 - uBleed) * 0.35;
  float edgeSoftness = 0.04 + uBleed * 0.06;

  float bleedMask = smoothstep(
    threshold + noiseOffset - edgeSoftness,
    threshold + noiseOffset + edgeSoftness,
    blurred
  );

  // Combine: keep original crisp text, add bleed around it
  float inkMask = max(orig, bleedMask);

  // ---- Edge detection for letterpress ink pooling ----
  // Sobel-ish gradient magnitude on original text
  float tl = 1.0 - texture(uOriginal, uv + vec2(-px.x, -px.y)).r;
  float tr = 1.0 - texture(uOriginal, uv + vec2( px.x, -px.y)).r;
  float bl = 1.0 - texture(uOriginal, uv + vec2(-px.x,  px.y)).r;
  float br = 1.0 - texture(uOriginal, uv + vec2( px.x,  px.y)).r;
  float l  = 1.0 - texture(uOriginal, uv + vec2(-px.x,  0.0 )).r;
  float r  = 1.0 - texture(uOriginal, uv + vec2( px.x,  0.0 )).r;
  float t  = 1.0 - texture(uOriginal, uv + vec2( 0.0,  -px.y)).r;
  float b  = 1.0 - texture(uOriginal, uv + vec2( 0.0,   px.y)).r;

  float gx = -tl - 2.0*l - bl + tr + 2.0*r + br;
  float gy = -tl - 2.0*t - tr + bl + 2.0*b + br;
  float edgeMag = length(vec2(gx, gy));

  // Also compute edge on blurred version for the bleed edge pooling
  float bl2 = 1.0 - texture(uBlurred, uv + vec2(-px.x, 0.0)).r;
  float br2 = 1.0 - texture(uBlurred, uv + vec2( px.x, 0.0)).r;
  float bt2 = 1.0 - texture(uBlurred, uv + vec2(0.0, -px.y)).r;
  float bb2 = 1.0 - texture(uBlurred, uv + vec2(0.0,  px.y)).r;
  float blurEdge = length(vec2(br2 - bl2, bb2 - bt2));

  // Combine edges
  float edge = max(edgeMag, blurEdge * 0.6);

  // ---- Ink density computation ----
  // Base ink darkness
  float inkStrength = uInkDensity * 0.85 + 0.15;

  // Letterpress effect: edges are darker (ink squeezed out)
  float pooling = edge * uEdgePool * 1.8;

  // Center of strokes slightly lighter (ink spread thin by pressure)
  float centerLightening = orig * (1.0 - edge) * (1.0 - uInkDensity * 0.2) * 0.12;

  // Paper fiber modulation (ink absorbs unevenly)
  float paperMod = mix(1.0, fiber * 0.6 + fineGrain * 0.4, uPaperGrain * 0.3);

  // Final ink opacity
  float inkAlpha = inkMask * (inkStrength + pooling - centerLightening) * paperMod;
  inkAlpha = clamp(inkAlpha, 0.0, 1.0);

  // ---- Micro-spatter: tiny isolated ink dots near edges ----
  float spatter = vnoise(baseCoord * 25.0 + 200.0);
  float spatterMask = smoothstep(0.02, 0.10, blurred) * (1.0 - smoothstep(0.10, 0.25, blurred));
  float spatterDots = step(0.72 - uBleed * 0.15, spatter) * spatterMask * uRoughness;
  inkAlpha = max(inkAlpha, spatterDots * 0.5);

  // ---- Paper color ----
  // Warm, slightly aged paper
  vec3 paperColor = vec3(0.945, 0.925, 0.890);

  // Subtle paper texture variation
  float paperTex = fbm(baseCoord * 2.5 + 500.0, 3);
  paperColor *= 0.96 + paperTex * 0.08;

  // Paper grain (visible fiber texture)
  float grainVis = mix(1.0, 0.92 + fiber * 0.12, uPaperGrain * 0.6);
  paperColor *= grainVis;

  // ---- Ink color ----
  // Not pure black - slightly warm, with density variation
  vec3 inkColor = vec3(0.04, 0.035, 0.05);
  // Slight color variation in ink
  inkColor += (roughNoise - 0.5) * 0.02;

  // ---- Composite ----
  vec3 color = mix(paperColor, inkColor, inkAlpha);

  // Subtle vignette (simulates uneven press pressure)
  vec2 vc = (uv - 0.5) * 2.0;
  float vignette = 1.0 - dot(vc, vc) * 0.06;
  color *= vignette;

  fragColor = vec4(color, 1.0);
}`;

// ============================================================
// WebGL2 Helpers
// ============================================================

function createShader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    gl.deleteShader(s);
    return null;
  }
  return s;
}

function createProgram(gl, vSrc, fSrc) {
  const v = createShader(gl, gl.VERTEX_SHADER, vSrc);
  const f = createShader(gl, gl.FRAGMENT_SHADER, fSrc);
  const p = gl.createProgram();
  gl.attachShader(p, v);
  gl.attachShader(p, f);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}

function getUniforms(gl, prog, names) {
  const u = {};
  for (const n of names) u[n] = gl.getUniformLocation(prog, n);
  return u;
}

function createFBO(gl, w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  return { fbo, tex, w, h };
}

// ============================================================
// Main App
// ============================================================

(function main() {
  const srcCanvas = document.getElementById('source');
  const srcCtx = srcCanvas.getContext('2d');

  const glCanvas = document.getElementById('gl');
  const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) {
    document.body.innerHTML = '<p style="color:red;padding:2em;">WebGL2 not supported.</p>';
    return;
  }

  // ---- Controls ----
  const textInput = document.getElementById('textInput');
  const fontSelect = document.getElementById('fontSelect');
  const fontSizeSlider = document.getElementById('fontSize');
  const bleedSlider = document.getElementById('bleedAmount');
  const roughnessSlider = document.getElementById('roughness');
  const inkDensitySlider = document.getElementById('inkDensity');
  const paperGrainSlider = document.getElementById('paperGrain');
  const edgePoolSlider = document.getElementById('edgePool');

  // ---- State ----
  let W, H, dpr;
  let srcTexture;
  let fboA, fboB; // ping-pong for blur
  let needsRedraw = true;

  // ---- Compile shaders ----
  const blurProg = createProgram(gl, VERT_QUAD, FRAG_BLUR);
  const blurU = getUniforms(gl, blurProg, ['uTex', 'uDir', 'uRadius']);

  const inkProg = createProgram(gl, VERT_QUAD, FRAG_INK);
  const inkU = getUniforms(gl, inkProg, [
    'uOriginal', 'uBlurred', 'uResolution', 'uFontSize',
    'uBleed', 'uRoughness', 'uInkDensity', 'uPaperGrain', 'uEdgePool'
  ]);

  // ---- Fullscreen quad VAO ----
  const quadVAO = gl.createVertexArray();
  gl.bindVertexArray(quadVAO);
  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  // ---- Source texture (will be updated from 2D canvas) ----
  srcTexture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, srcTexture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  // ---- Resize handling ----
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = Math.round(window.innerWidth * dpr);
    H = Math.round(window.innerHeight * dpr);

    glCanvas.width = W;
    glCanvas.height = H;
    srcCanvas.width = W;
    srcCanvas.height = H;

    // Recreate FBOs
    if (fboA) { gl.deleteFramebuffer(fboA.fbo); gl.deleteTexture(fboA.tex); }
    if (fboB) { gl.deleteFramebuffer(fboB.fbo); gl.deleteTexture(fboB.tex); }
    fboA = createFBO(gl, W, H);
    fboB = createFBO(gl, W, H);

    gl.viewport(0, 0, W, H);
    needsRedraw = true;
  }

  window.addEventListener('resize', () => { resize(); renderSourceText(); });
  resize();

  // ---- Render text to source canvas ----
  function renderSourceText() {
    const ctx = srcCtx;
    const text = textInput.value || ' ';
    const fontFamily = fontSelect.value;
    const fontSize = parseFloat(fontSizeSlider.value) * dpr;

    ctx.clearRect(0, 0, W, H);

    // White background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // Black text
    ctx.fillStyle = '#000000';
    ctx.font = `bold ${fontSize}px ${fontFamily}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Handle multi-line (split on newline) or single line
    const lines = text.split('\n');
    const lineHeight = fontSize * 1.15;
    const totalHeight = lines.length * lineHeight;
    const startY = H / 2 - totalHeight / 2 + lineHeight / 2;

    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W / 2, startY + i * lineHeight);
    }

    // Upload to WebGL texture
    gl.bindTexture(gl.TEXTURE_2D, srcTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);

    needsRedraw = true;
  }

  // ---- Draw a fullscreen quad ----
  function drawQuad() {
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // ---- Multi-pass Gaussian Blur ----
  // We do multiple iterations at smaller radii for a cleaner, wider blur
  function blurPass(inputTex, radius) {
    // Clamp max kernel radius for performance. If radius > 40, do multiple iterations.
    const maxKernel = 40;
    let iterations = Math.ceil(radius / maxKernel);
    let perPassRadius = radius / iterations;

    let readTex = inputTex;

    gl.useProgram(blurProg);

    for (let iter = 0; iter < iterations; iter++) {
      // Horizontal
      gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fbo);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, readTex);
      gl.uniform1i(blurU.uTex, 0);
      gl.uniform2f(blurU.uDir, 1.0 / W, 0.0);
      gl.uniform1f(blurU.uRadius, perPassRadius);
      drawQuad();

      // Vertical
      gl.bindFramebuffer(gl.FRAMEBUFFER, fboB.fbo);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, fboA.tex);
      gl.uniform1i(blurU.uTex, 0);
      gl.uniform2f(blurU.uDir, 0.0, 1.0 / H);
      gl.uniform1f(blurU.uRadius, perPassRadius);
      drawQuad();

      readTex = fboB.tex;
    }

    return fboB.tex; // final blurred result
  }

  // ---- Main render ----
  function render() {
    if (!needsRedraw) {
      requestAnimationFrame(render);
      return;
    }
    needsRedraw = false;

    const bleedVal = parseFloat(bleedSlider.value) / 100;
    const roughVal = parseFloat(roughnessSlider.value) / 100;
    const densityVal = parseFloat(inkDensitySlider.value) / 100;
    const grainVal = parseFloat(paperGrainSlider.value) / 100;
    const poolVal = parseFloat(edgePoolSlider.value) / 100;

    // Blur radius scales with bleed amount and font size (scale-independent)
    const fontSizePx = parseFloat(fontSizeSlider.value) * dpr;
    const blurRadius = bleedVal * fontSizePx * 0.08 + 1.0;

    // Pass 1 & 2: Blur
    const blurredTex = blurPass(srcTexture, blurRadius);

    // Pass 3: Ink composite (render to screen)
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(inkProg);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, srcTexture);
    gl.uniform1i(inkU.uOriginal, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, blurredTex);
    gl.uniform1i(inkU.uBlurred, 1);

    gl.uniform2f(inkU.uResolution, W, H);
    gl.uniform1f(inkU.uFontSize, fontSizePx);
    gl.uniform1f(inkU.uBleed, bleedVal);
    gl.uniform1f(inkU.uRoughness, roughVal);
    gl.uniform1f(inkU.uInkDensity, densityVal);
    gl.uniform1f(inkU.uPaperGrain, grainVal);
    gl.uniform1f(inkU.uEdgePool, poolVal);

    drawQuad();

    requestAnimationFrame(render);
  }

  // ---- UI wiring ----
  function sliderUpdate(slider, valEl) {
    valEl.textContent = slider.value;
    needsRedraw = true;
  }

  const sliders = [
    [fontSizeSlider, document.getElementById('fontSizeVal')],
    [bleedSlider, document.getElementById('bleedAmountVal')],
    [roughnessSlider, document.getElementById('roughnessVal')],
    [inkDensitySlider, document.getElementById('inkDensityVal')],
    [paperGrainSlider, document.getElementById('paperGrainVal')],
    [edgePoolSlider, document.getElementById('edgePoolVal')],
  ];

  for (const [s, v] of sliders) {
    s.addEventListener('input', () => {
      sliderUpdate(s, v);
      // Font size also needs re-render of source text
      if (s === fontSizeSlider) renderSourceText();
    });
  }

  textInput.addEventListener('input', renderSourceText);
  fontSelect.addEventListener('change', renderSourceText);

  // ---- Init ----
  renderSourceText();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
